; The Ansible control node itself, kept static and local.
;
; This must stay a separate static entry: the dynamic EC2 inventory would also
; discover this instance and hand it a private IP plus an SSH key, and ansible
; would then try to SSH to itself. ansible_connection=local short-circuits that.
;
; Ansible merges every source in an inventory directory, and this file sorts
; before 10-aws_ec2.yml, so the dynamic source refines these hosts rather than
; replacing them. Set this instance's Name tag to "ansible-control" so the two
; sources describe the same host instead of producing a duplicate row.
[control]
ansible-control ansible_host=127.0.0.1 ansible_connection=local
