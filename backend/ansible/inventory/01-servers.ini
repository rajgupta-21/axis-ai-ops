; Manually-declared managed hosts.
;
; This is the fallback for hosts that dynamic discovery cannot see yet — most
; commonly because the control node has no IAM role, or an instance lives in
; another account or region. Anything listed here works with no AWS API access
; at all, since it needs only an address and a key.
;
; Once 10-aws_ec2.yml is discovering an instance by its Name tag, its entry here
; becomes redundant and can be deleted: ansible merges sources by hostname, so a
; host present in both is one host, not two. Keeping a duplicate is harmless but
; means its address is pinned here rather than tracked from AWS.
[servers]
new-ec2 ansible_host=172.31.1.213 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ec2-user/nginx.pem
