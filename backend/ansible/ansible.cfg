# Control-node ansible configuration. Belongs at /home/ec2-user/.ansible.cfg —
# the backend invokes ansible over SSH with no explicit cwd, so it lands in the
# home directory and this file is picked up.

[defaults]
# The aws_ec2 plugin is not enabled by default.
inventory_plugins_enabled = aws_ec2, host_list, script, auto, yaml, ini, toml
inventory = /home/ec2-user/inventory

# Host-key verification stays ON. The backend's own hop to this instance keeps
# StrictHostKeyChecking enabled (see ANSIBLE_SSH_STRICT_HOST_KEY_CHECKING) and
# turning it off here would quietly undo that protection for the second hop.
# New instances need one `ssh-keyscan -H <private-ip> >> ~/.ssh/known_hosts`,
# which add-host.sh does for you.
host_key_checking = True

# Two deliberate changes from ansible's default ignore list, both required for a
# directory-based inventory to work here:
#
#   - ".ini" is REMOVED. Ansible ignores .ini files by default when scanning an
#     inventory directory, so 00-control.ini and 01-servers.ini would be skipped
#     silently and the whole directory would fail with "No inventory was parsed".
#   - ".disabled" is ADDED, so a staged-but-inactive source (10-aws_ec2.yml.disabled,
#     waiting on an IAM role) is skipped instead of failing to parse and taking
#     every other host in the directory down with it.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry, .disabled

# Facts are gathered per host on demand by the backend; no fact cache needed.
gathering = explicit
interpreter_python = auto_silent
stdout_callback = default

[inventory]
# Fail when *nothing* could be parsed — a silently empty inventory looks
# identical to "you have no servers" in the UI.
unparsed_is_failed = True

# But do NOT fail when only *one* source fails. The dynamic EC2 source depends
# on IAM and network reachability, and if it errors we still want the static
# control-node entry to load so the dashboard degrades to one host instead of
# going down entirely.
any_unparsed_is_failed = False

[ssh_connection]
# The backend issues several ansible runs per dashboard request; reusing the
# connection to each managed host avoids a full handshake every time.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
pipelining = True
